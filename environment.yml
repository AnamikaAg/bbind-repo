name: bbind-env
channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip

  # Core numerics/data
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - statsmodels

  # Bayesian inference / posterior analysis
  - jax
  - jaxlib
  - numpyro
  - arviz

  # Single-cell / annotated matrix analysis
  - scanpy
  - anndata
  - h5py

  # Plotting / IO / utilities
  - matplotlib
  - seaborn
  - openpyxl
  - tqdm
  - xarray

  # Notebook support
  - ipykernel
  - notebook